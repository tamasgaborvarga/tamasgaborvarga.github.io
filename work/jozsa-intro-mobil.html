<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark"><!-- a work.html iframe-jével egyezően, különben a böngésző átlátszatlan vásznat fest -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Józsa logó-intro — „építkezés” változat</title>
<!--
  ALTERNATÍV MOBIL LOGÓ-INTRO („építkezés”: tervrajz, súly, daru). Önállóan próbálható:
    R vagy ↻ gomb = újrajátszás · ?hold = megáll a végén (nem tűnik el) · ?slow = 4× lassítás
  A build (tools/make_beton_aruhaz.py) NEM ezt olvassa, hanem az intro/logo-intro.html-t.
  Ha ez lesz a végleges: a két INTRO-marker közötti részt másold át oda (vagy nevezd át ezt a fájlt).
  Az előző (v4) változat: intro/logo-intro-epitkezes-elozo.html
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Source+Sans+3:wght@400..700&display=swap" rel="stylesheet">
<style>
/* az élő oldal tokenjei, amiket az intro használ */
:root{--paper:#F5F2EC;--ink:#13253D;--red:#B8302A;--red-fill:#E5342B;
  --night:#13253D;--on-night:#EEF1F5;--on-night-2:#B9C3D2;
  --display:"Archivo",system-ui,sans-serif;--body:"Source Sans 3",system-ui,sans-serif;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--paper);color:var(--ink);min-height:100vh}
/* hero-makett, hogy az átmenet is látsszon */
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.mock{padding:96px 20px 0;max-width:640px}
.mock>*{animation:rise .8s var(--ease) both}
.mock h1{font-family:var(--display);font-weight:800;font-stretch:108%;font-size:2.5rem;line-height:1.05;letter-spacing:-.03em;animation-delay:.08s}
.mock h1 em{font-style:normal;color:var(--red)}
.mock p{margin-top:20px;font-size:1.1rem;line-height:1.55;color:#34435A;animation-delay:.16s}
.dev{position:fixed;right:12px;bottom:12px;z-index:2000;display:flex;gap:8px;font:600 13px/1 system-ui}
.dev a,.dev button{background:#fff;color:#13253D;border:1px solid #D8D0C2;border-radius:99px;padding:9px 14px;cursor:pointer;text-decoration:none}
html,body{background:transparent!important}
</style>
<script>
var q=location.search;window.JX_INTRO_FORCE=true;window.JX_INTRO_HOLD=/hold/.test(q);
if(/slow/.test(q)){
  /* 4× lassítás: a CSS-animációk/-átmenetek playbackRate-je és az intro időzítői együtt */
  var _st=window.setTimeout;window.setTimeout=function(f,ms){return _st(f,(ms||0)*4)};
  (function tick(){document.getAnimations().forEach(function(a){a.playbackRate=.25});requestAnimationFrame(tick)})();
}
</script>
</head>
<body>
<!-- INTRO:START -->
<script>
/* ============ MOBIL LOGÓ-INTRO (v5: „építkezés”, finomhangolt) ============
   Csak ≤767 px-es viewporton (nem user-agent alapján), és csak ha nincs „csökkentett mozgás”.
   Desktopon/tableten ez az egy matchMedia-ellenőrzés fut le: se overlay, se CSS, se időzítő.
   Koncepció: a tervrajz valósággá válik. Minden mozdulatnak fizikai oka van (súly, csörlő, inga),
   és minden a függőleges tengelyből vagy a talpvonalból indul — ez a darab „mozgásnyelve”.
     KITŰZÉS   0,05 s  a talpvonal középről kicsapódik, a végjelei bekattannak; felrajzolódik a
                       szaggatott-pontozott tengelyvonal (később ezen ereszkedik le a daru kötele)
     TERV      0,14 s  az 5 elem zsaluzata (kontúrja) tollszerűen kirajzolódik, alulról felfelé
     ALAP      0,42 s  szabadesés → 0,74 s becsapódás: 1 px-es összenyomódás, a talpvonalon középről
                       kifutó fényhullám, a „kamera” 1,6 px-et rándul; a zsaluzat feloldódik
     OSZLOPOK  0,84 s  bal, majd jobb oszlop feláll — tak, tak
     DARU      0,98 s  a tetőmodul (gerenda + tető) a képen kívülről érkezik, lassulva „centiz”; a lengése
                       (kitérés + billegés a horog körül) letételre pontosan nullára csillapodik;
                       a tengelyvonal átadja a helyét a kötélnek
     LETÉTEL   1,68 s  a kötél belazul, a hevederek leoldanak, a csörlő gyorsulva kihúzza a horgot
     SZÓJEL    1,68 s  JÓZSA KFT. középről kifelé, betűnként; 1,96 s TISZAFÜRED középről kinyílik
     KILÉPÉS   2,55 s  a talpvonal kifut a képernyő széléig (a végjelek kiúsznak), és még futás közben
                       a képernyő e vonal mentén kettényílik (egy folyamatos mozdulat): a jel a felső, a szójel az alsó panellel távozik, a vágás két éle
                       a panelekkel halad; alatta indul a hero animációja
   Az időzítések egy helyen vannak (T, D); a daru mozgása mintavételezett fizikából generált keyframe.
   Munkamenetenként egyszer; koppintásra átugorható (a kilépő mozdulat akkor is lefut).
   Szándékosan a body elején: az első festésnél már az overlay látszik, nincs hero-villanás. */
(function(){
  var mm=window.matchMedia,F=window.JX_INTRO_FORCE; /* F: csak a munkapéldányokban */
  if(!F&&(!mm||!mm('(max-width:767px)').matches||mm('(prefers-reduced-motion:reduce)').matches))return;
  if(!F)try{if(sessionStorage.getItem('jx-intro'))return;sessionStorage.setItem('jx-intro','1')}catch(e){}
  var root=document.documentElement;root.classList.add('intro');
  /* mozgás-tokenek: minden mozdulattípusnak saját, fizikailag indokolt görbéje van */
  var PEN='cubic-bezier(.6,0,.2,1)',      /* rajzolás: a toll gyorsul, majd pontosan megáll */
      SNAP='cubic-bezier(.2,.9,.25,1)',   /* gépies elhelyezés: gyors indulás, kemény megállás */
      FALL='cubic-bezier(.5,0,1,.5)',     /* szabadesés: végig gyorsul */
      HOIST='cubic-bezier(.55,0,.9,.35)', /* csörlő: lassan indul, gyorsulva viszi ki a horgot */
      EXT='cubic-bezier(.4,0,.2,1)',      /* vágóvonal: lágyan indul a talpvonalból, nincs „rántás” */
      DOOR='cubic-bezier(.65,0,.25,1)';   /* kilépő panelek */
  /* idővonal (s) és időtartamok — minden ütem innen számolódik */
  var T={line:.05,axis:.12,draw:.14,base:.42,colL:.84,colR:.96,crane:.98,city:1.96,exit:2.55},
      D={drop:.42,erect:.28,crane:.7},
      HIT=T.base+D.drop*.76,   /* az alap becsapódása (a jx-drop 76%-ánál) */
      LAND=T.crane+D.crane,    /* a tetőmodul letétele */
      GW=200;                  /* a talpvonal szélessége (px) */
  function s(x){return x.toFixed(3)+'s'}
  /* daru: gyors érkezés a képen kívülről, lassú „centizés” (quart-out), csillapodó lengés;
     letételkor a kitérés, a billegés és a sebességük is pontosan 0 */
  function sway(p,a,ph){return a*Math.pow(1-p,1.5)*Math.sin(2*Math.PI*1.75*p+ph)}
  var kc='',kr='',i;
  for(i=0;i<=30;i++){
    var p=i/30,at=(p*100).toFixed(2)+'%';
    kc+=at+'{transform:translate('+sway(p,5,0).toFixed(2)+'px,'+(-420*Math.pow(1-p,4)).toFixed(2)+'px)}';
    kr+=at+'{transform:rotate('+sway(p,2.5,-1).toFixed(3)+'deg)}';
  }
  /* minden kontúr akkor oldódik fel, amikor a saját eleme a helyére került */
  var lock=[HIT,T.colL+D.erect,T.colR+D.erect,LAND,LAND],lnDelay='';
  for(i=0;i<5;i++)lnDelay+='.jx-ln.l'+(i+1)+'{animation-delay:'+s(T.draw+i*.06)+','+s(lock[i])+'}';
  var LN='fill:none;stroke:var(--on-night-2);stroke-width:1;vector-effect:non-scaling-stroke;';
  var st=document.createElement('style');
  st.textContent=
    'html.intro{overflow:hidden}'+
    'html.intro body>:not(.jx-intro),html.intro body>:not(.jx-intro) *{animation-play-state:paused!important}'+
    '.jx-intro{position:fixed;inset:0;z-index:1000;display:grid;place-content:center;justify-items:center;cursor:pointer}'+
    '.jx-intro.out{pointer-events:none}'+
    /* két kék panel; kilépéskor a talpvonal (--y) mentén nyílnak szét, a vágás éle mindkettőn végigfut.
       1 px átfedés: nincs hajszálrés */
    '.jx-pn{position:absolute;left:0;right:0;background:var(--night);will-change:transform;transition:transform .75s '+DOOR+'}'+
    '.jx-pt{top:0;height:calc(var(--y,50%) + 1px)}.jx-pb{top:var(--y,50%);bottom:0}'+
    '.jx-pt:after,.jx-pb:before{content:"";position:absolute;left:0;right:0;height:1px;background:var(--on-night-2);opacity:0;transition:opacity .2s ease}'+
    '.jx-pt:after{bottom:0}.jx-pb:before{top:0}'+
    '.jx-intro.open .jx-pt{transform:translateY(-100%)}.jx-intro.open .jx-pb{transform:translateY(100%)}'+
    '.jx-intro.open .jx-pt:after,.jx-intro.open .jx-pb:before{opacity:.5}'+
    /* mérnöki rács: a belső réteg jelenik meg, a külső tűnik el (így a kettő nem akad össze) */
    '.jx-gw{position:absolute;inset:0;pointer-events:none;transition:opacity .3s ease}'+
    '.jx-intro.out .jx-gw{opacity:0}'+
    '.jx-grid{position:absolute;inset:0;'+
      'background-image:linear-gradient(rgba(238,241,245,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(238,241,245,.06) 1px,transparent 1px);'+
      'background-size:24px 24px;background-position:center;'+
      '-webkit-mask:radial-gradient(closest-side,#000 30%,transparent);mask:radial-gradient(closest-side,#000 30%,transparent);'+
      'animation:jx-show 1s ease both}'+
    /* vágóvonal + végjelek: a talpvonal pontos helyén jelennek meg, onnan futnak ki a képernyő széléig.
       Átmenet csak az .out állapotban van, így a kiinduló --s beállítása nem animálódik */
    '.jx-cut,.jx-tk{position:absolute;background:var(--on-night-2);opacity:0;pointer-events:none}'+
    '.jx-cut{left:0;right:0;top:var(--y);height:1px;transform:scaleX(var(--s,0))}'+
    '.jx-tk{left:50%;top:calc(var(--y) - 4px);width:1px;height:9px}'+
    '.jx-tl{transform:translateX(-'+GW/2+'px)}.jx-tr{transform:translateX('+(GW/2-1)+'px)}'+
    '.jx-intro.out .jx-cut,.jx-intro.out .jx-tk{opacity:.5;transition:transform .4s '+EXT+'}'+
    '.jx-intro.out .jx-cut{transform:scaleX(1)}'+
    '.jx-intro.out .jx-tl{transform:translateX(calc(var(--hw) * -1))}.jx-intro.out .jx-tr{transform:translateX(var(--hw))}'+
    /* a vágóvonal a nyílás elején áttűnik a két panel élébe, miközben még fut kifelé */
    '.jx-intro.open .jx-cut,.jx-intro.open .jx-tk{opacity:0;transition:transform .4s '+EXT+',opacity .2s ease}'+
    /* tartalom: kilépéskor a jel a felső, a szójel az alsó panellel távozik, kicsit előrébb járva (mélység) */
    '.jx-in{position:relative;isolation:isolate;display:grid;justify-items:center}'+
    '.jx-in:before{content:"";position:absolute;z-index:-1;left:50%;top:70px;width:380px;height:380px;margin:-190px 0 0 -190px;'+
      'background:radial-gradient(closest-side,rgba(185,195,210,.14),transparent);'+
      'animation:jx-glow 2.4s cubic-bezier(.2,.6,.2,1) .1s backwards;transition:opacity .3s ease}'+
    '.jx-intro.out .jx-in:before{opacity:0}.jx-intro.open .jx-in:before{visibility:hidden}'+
    '.jx-mark,.jx-wm{transition:transform .75s '+DOOR+'}'+
    '.jx-intro.open .jx-mark{transform:translateY(calc(var(--y) * -1.1))}'+
    '.jx-intro.open .jx-wm{transform:translateY(calc((var(--h) - var(--y)) * 1.1))}'+
    /* jel; a „kamera” (jx-jolt) a becsapódásra rándul egyet */
    '.jx-mark{position:relative;width:112px;height:140px}'+
    '.jx-jolt{position:absolute;inset:0;animation:jx-jolt .28s ease '+s(HIT)+'}'+
    '.jx-mark svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}'+
    /* talpvonal + becsapódási fényhullám */
    '.jx-guide,.jx-rip{position:absolute;left:50%;bottom:6px;width:'+GW+'px;height:1px;margin-left:-'+GW/2+'px}'+
    '.jx-guide{background:var(--on-night-2);opacity:.5;animation:jx-wide .35s '+SNAP+' '+s(T.line)+' backwards}'+
    '.jx-guide:before,.jx-guide:after{content:"";position:absolute;top:-4px;width:1px;height:9px;background:inherit;'+
      'animation:jx-tick .2s '+SNAP+' '+s(T.line+.3)+' backwards}'+
    '.jx-guide:before{left:0}.jx-guide:after{right:0}'+
    '.jx-intro.out .jx-guide{visibility:hidden}'+
    '.jx-rip{background:var(--on-night);box-shadow:0 0 6px rgba(238,241,245,.7);opacity:0;animation:jx-rip .5s '+SNAP+' '+s(HIT)+' forwards}'+
    /* tengely (szaggatott-pontozott, mint a tervrajzon) és zsaluzat (kontúrok) */
    '.jx-axis{'+LN+'stroke-opacity:.45;stroke-dasharray:7 3 1.5 3;transform-box:fill-box;transform-origin:50% 100%;'+
      'animation:jx-up .5s '+PEN+' '+s(T.axis)+' both,jx-fade .3s ease '+s(T.crane+.04)+' forwards}'+
    /* a kontúroknál NINCS non-scaling-stroke: azzal a pathLength-hez mért szaggatás képernyő-, a hossz
       viszont felhasználói egységben számolódik, és a vonal utolsó ~20%-a sosem rajzolódna ki.
       .8 egység ≈ 1 px ennél a méretnél */
    '.jx-ln{fill:none;stroke:var(--on-night-2);stroke-width:.8;stroke-opacity:.7;stroke-dasharray:1;stroke-dashoffset:1;'+
      'animation:jx-draw .45s '+PEN+' both,jx-fade .3s ease forwards}'+
    lnDelay+
    /* alap: zuhan és megül · oszlopok: felállnak */
    '.jx-intro .p{transform-box:fill-box;transform-origin:50% 100%}'+
    '.jx-intro .p1{animation:jx-drop '+D.drop+'s linear '+s(T.base)+' both}'+
    '.jx-intro .p2{animation:jx-up '+D.erect+'s '+SNAP+' '+s(T.colL)+' both}'+
    '.jx-intro .p3{animation:jx-up '+D.erect+'s '+SNAP+' '+s(T.colR)+' both}'+
    /* daru: jx-crane = süllyedés + lengés, jx-load = billegés a horog körül,
       jx-hoist = kötél és horogblokk (belazul, vár, kihúzódik), jx-sling = hevederek (belazulnak, leoldanak) */
    '.jx-crane{animation:jx-crane '+D.crane+'s linear '+s(T.crane)+' both}'+
    '.jx-load{transform-box:fill-box;transform-origin:50% 0;animation:jx-rock '+D.crane+'s linear '+s(T.crane)+' both}'+
    '.jx-hoist{animation:jx-hoist .5s linear '+s(LAND)+' both}'+
    '.jx-rig{'+LN+'}.jx-hook{fill:var(--on-night-2)}'+
    '.jx-sling{transform-box:fill-box;transform-origin:50% 100%;animation:jx-slack .1s ease-out '+s(LAND)+' both,jx-fade .1s ease '+s(LAND+.1)+' forwards}'+
    /* szójel */
    '.jx-wm{margin-top:22px;text-align:center;color:var(--on-night);font-family:var(--display);line-height:1}'+
    '.jx-mask{display:block;overflow:hidden;padding:.16em .1em .08em}'+
    '.jx-w1{display:block;font-size:2.1rem;font-weight:800;font-stretch:112%;letter-spacing:-.01em;white-space:pre}'+
    '.jx-c{display:inline-block;will-change:transform;animation:jx-rise .5s '+SNAP+' both}'+
    '.jx-w2{display:block;margin-top:12px;padding-left:1em;font-size:.92rem;font-weight:700;letter-spacing:1em;color:var(--on-night-2);'+
      'animation:jx-open .55s '+SNAP+' '+s(T.city)+' both}'+
    /* keyframe-ek */
    '@keyframes jx-show{from{opacity:0}}'+
    '@keyframes jx-glow{from{opacity:0;transform:scale(.7)}}'+
    '@keyframes jx-wide{from{transform:scaleX(0)}}'+
    '@keyframes jx-tick{from{transform:scaleY(0)}}'+
    '@keyframes jx-up{from{transform:scaleY(0)}}'+
    '@keyframes jx-draw{to{stroke-dashoffset:0}}'+
    '@keyframes jx-fade{to{opacity:0}}'+
    '@keyframes jx-rip{from{transform:scaleX(.04);opacity:1}to{transform:scaleX(1);opacity:0}}'+
    '@keyframes jx-jolt{25%{transform:translateY(1.6px)}50%{transform:translateY(-.6px)}75%{transform:translateY(.2px)}}'+
    /* szabadesés → kemény megállás (76%) → 1 px összenyomódás → nyugalom */
    '@keyframes jx-drop{0%{transform:translateY(-30px);opacity:0;animation-timing-function:'+FALL+'}18%{opacity:1}'+
      '76%{transform:translateY(0);animation-timing-function:'+SNAP+'}86%{transform:translateY(0) scaleY(.92)}100%{transform:translateY(0) scaleY(1)}}'+
    '@keyframes jx-crane{'+kc+'}@keyframes jx-rock{'+kr+'}'+
    '@keyframes jx-hoist{0%{transform:translateY(0);animation-timing-function:ease-out}20%{transform:translateY(1.5px);animation-timing-function:linear}'+
      '40%{transform:translateY(1.5px);animation-timing-function:'+HOIST+'}100%{transform:translateY(-560px)}}'+
    '@keyframes jx-slack{to{transform:scaleY(.968)}}'+
    '@keyframes jx-rise{from{transform:translateY(140%)}}'+
    '@keyframes jx-open{from{-webkit-clip-path:inset(0 50% 0 50%);clip-path:inset(0 50% 0 50%)}}';
  document.head.appendChild(st);
  /* sorrend = építési sorrend: 1 alap, 2 bal oszlop, 3 jobb oszlop, 4 gerenda, 5 tető */
  var BEAM='M28 49 H100 V68 H78 A14 14 0 0 0 50 68 H28 Z',ROOF='M64 15 L106 49 L22 49 Z',
      outl=['M28 103 H100 V115 H28 Z','M32 68 H50 V103 H32 Z','M78 68 H96 V103 H78 Z',BEAM,ROOF],
      svg='<svg viewBox="20 10 88 110"><path class="jx-axis" d="M64 115 V-8"/>';
  for(i=0;i<5;i++)svg+='<path class="jx-ln l'+(i+1)+'" pathLength="1" d="'+outl[i]+'"/>';
  svg+='<rect class="p p1" x="28" y="103" width="72" height="12" fill="#2FA84F"/>'+
    '<rect class="p p2" x="32" y="68" width="18" height="35" fill="#29A9E1"/>'+
    '<rect class="p p3" x="78" y="68" width="18" height="35" fill="#FBCF07"/>'+
    /* tetőmodul a daruval: kötél + horogblokk, alatta a hevederek az ereszekhez; a billegés forgáspontja
       a terhelés befoglaló dobozának felső közepe = a horog (64, 2) */
    '<g class="jx-crane"><g class="jx-hoist"><path class="jx-rig" d="M64 -3 V-600"/>'+
      '<rect class="jx-hook" x="62" y="-3" width="4" height="5" rx=".8"/></g>'+
    '<g class="jx-load"><path class="jx-rig jx-sling" d="M22 49 L64 2 L106 49"/>'+
      '<path d="'+BEAM+'" fill="#2FA84F"/><path d="'+ROOF+'" fill="#E5342B"/></g></g></svg>';
  /* szójel: középről kifelé, betűnként */
  var w='',t='JÓZSA KFT.',mid=(t.length-1)/2;
  for(i=0;i<t.length;i++)w+='<span class="jx-c" style="animation-delay:'+s(LAND+(Math.abs(i-mid)-.5)*.035)+'">'+t[i]+'</span>';
  var ov=document.createElement('div');ov.className='jx-intro';ov.setAttribute('aria-hidden','true');
  ov.innerHTML='<div class="jx-pn jx-pt"></div><div class="jx-pn jx-pb"></div><div class="jx-gw"><div class="jx-grid"></div></div>'+
    '<span class="jx-cut"></span><span class="jx-tk jx-tl"></span><span class="jx-tk jx-tr"></span>'+
    '<div class="jx-in"><div class="jx-mark"><div class="jx-jolt"><span class="jx-guide"></span><span class="jx-rip"></span>'+svg+'</div></div>'+
    '<div class="jx-wm"><span class="jx-mask"><span class="jx-w1">'+w+'</span></span><span class="jx-w2">TISZAFÜRED</span></div></div>';
  document.body.insertBefore(ov,document.body.firstChild);
  var done=false;
  function finish(){
    if(done)return;done=true;
    /* a vágás pontosan a talpvonal helyén indul (törtpixelre is), onnan nő ki a képernyő széléig */
    var g=ov.querySelector('.jx-guide').getBoundingClientRect(),W=ov.clientWidth;
    ov.style.setProperty('--y',g.top+'px');
    ov.style.setProperty('--h',ov.clientHeight+'px');
    ov.style.setProperty('--s',GW/W);
    ov.style.setProperty('--hw',(W/2+8)+'px');
    void ov.offsetWidth; /* a kiinduló állapot rögzítése, hogy az átmenetek innen induljanak */
    ov.classList.add('out');
    setTimeout(function(){ov.classList.add('open')},260);
    /* a panelek nyílásának harmadánál indul a hero belépője, így a kettő egy mozdulatnak hat */
    setTimeout(function(){root.classList.remove('intro')},510);
    setTimeout(function(){ov.remove();st.remove()},1060);
  }
  if(!window.JX_INTRO_HOLD)setTimeout(finish,T.exit*1000);
  ov.addEventListener('click',finish);
})();
</script>
